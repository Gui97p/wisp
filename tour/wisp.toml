# Every key is optional, and each one has a command line counterpart that
# takes priority. Paths are relative to this file. The keys on top come before
# any [table], because a key written after a [table] line belongs to it.

# Without a target the project builds for the host: x86-64 on Linux.
# target = "linux_x64"

# `wisp run` finds `main` by itself; set this when a project has several.
# entry = "main.wsp"

# The standard library. `std/` imports resolve to the bundled one unless you
# point them at a folder of your own, or turn the library off altogether:
# any `import "std/..."` is then an error.
# std = "kernel/std"
# freestanding = true

# Extra arguments for the linker, in order: object files, archives, -L and -l.
# Run from this folder. See the _c folder for a project that uses it.
# link = ["lib.o"]

# Link the system C library and start the program through its startup code,
# so C functions such as printf work. Needs the `cc` driver.
# libc = true

# Where a build writes its files. Without this table, everything goes under a
# folder named after the target: bin/<target>/, build/<target>/, dist/<target>/.
# A target can have its own, with the same keys: [targets.linux_x64.output].
[output]
bin = "bin/tour"
# obj = "build/obj"
# asm = "build/asm"
# lua = "dist"

# A target of your own, for instance a userspace for a kernel.
# `wisp init target mykernel` creates this block and its files.
#
# [targets.mykernel]
# arch = "x64"                  # required, only x64 exists for now
# os = "mykernel"               # a second name that native blocks can select
# entry = "_start"              # the symbol the linker starts at
# start = "targets/mykernel/start.asm"       # required: calls main and leaves
# runtime = "targets/mykernel/runtime.asm"   # emit, panic, malloc and friends
# link = ["-z", "noexecstack"]  # extra linker arguments
# libc = false                  # link the C library for this target
#
# [targets.mykernel.output]     # where this target writes, instead of [output]
# bin = "dist/mykernel/app.elf"
#
# A block named after a built-in target adjusts it instead of creating one:
# its link arguments are added to the built-in ones, and the other keys replace
# the built-in values (arch cannot change, and lua only takes output).
#
# [targets.linux_x64]
# link = ["-lm"]
