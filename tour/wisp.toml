# Every key is optional, and each one has a command line counterpart that
# takes priority. Paths are relative to this file. The keys on top come before
# any [table], because a key written after a [table] line belongs to it.

# The system to build for, and its architecture. Without them the project
# builds for the host: `linux` or `windows`, both x64. The
# architecture is only needed when a system has more than one; otherwise it is
# a check. `--os` and `--arch` take priority.
# os = "linux"
# arch = "x64"

# `wisp run` finds `main` by itself when a project has just one. With several, declare
# the programs below, and `default` names the one `wisp run` starts when no name
# is given.
# default = "app"

# The standard library. `std/` imports resolve to the one that ships with the
# compiler unless you point them at a folder of your own, or turn the library
# off altogether with "none": any `import "std/..."` is then an error.
# std = "kernel/std"
# std = "none"

# Other projects. A dependency is a folder with Wisp code, written
# name = { path = "../folder" } relative to this file. `import "name"` is the
# module file of its root folder (folder/folder.wsp) and `import "name/util"`
# a module inside it; the project keeps its own imports and dependencies. A
# build uses one folder per name, and a name cannot also be a folder or file of
# this project.
#
# [dependencies]
# geometry = { path = "../geometry" }

# Several projects that import each other by name, with no path written. An
# empty [workspace] is enough: every folder next to this file that has a
# wisp.toml of its own is a member, so a new project joins by itself. Members
# can also be listed, with patterns ("crates/*"), and `exclude` leaves folders
# out. A project is called after its folder unless [project] name says
# otherwise. At the root of a workspace without code of its own, check, build,
# test, fmt and clean run in every member.
#
# [workspace]
# members = ["crates/*", "tools"]
# exclude = ["examples"]
#
# [project]
# name = "geo"

# Native (C) libraries. Name them without lib or extension and the compiler
# finds them in the system folders (/usr/lib and friends), links them and asks
# for the dynamic linker by itself: "SDL3" works with just libSDL3.so.0
# installed. `search` adds folders (relative to this file) for libraries kept
# elsewhere, and `wisp run` points the loader at them. A system table, such as
# [native.windows], adds to these for that system only. Declare the functions
# with `extern func`. `wisp doctor` says whether each library is found.
#
# [native]
# libs = ["SDL3"]
# search = ["vendor/lib"]
#
# [native.windows]
# search = ["vendor/win/lib"]

# Extra arguments for the linker, in order: object files, archives, -L and -l.
# Run from this folder. See the _c folder for a project that uses it.
# link = ["lib.o"]

# Link the system C library and start the program through its startup code,
# so C functions such as printf work. Needs the `cc` driver.
# libc = true

# Where a build writes its files, for every program. All three are folders.
# `bin` receives the final products, each under the name of its program (an
# executable). `obj` and `asm` receive the object files and the generated
# assembly. {profile}, {target} (the system
# and the architecture, as in linux-x64), {os}, {arch} and {name} (the program)
# are replaced, so one pattern serves every program and system. A program with
# its own place goes in [program.<name>.output]. Without this table the files go
# to bin/<profile>/<target>/ and build/<profile>/<target>/<name>/.
[output]
bin = "bin"
# obj = "build/obj"
# asm = "build/asm"

# Profiles. A build uses one of two profiles, debug (the default) or release,
# chosen with `profile`, for a program or export with its own `profile` key,
# or on the command line with --profile release or --release. Each profile is a
# set of switches, and [profiles.debug] and [profiles.release] change only the
# ones written there:
#
#   trace     keep the call stack information a panic prints as a trace
#   snippets  show the line of source in the blocks that report an error
#   strip     remove the symbol table from the binary
#   optimize  spend effort on faster code
#   checks    keep index, division and null checks
#
# debug turns on trace and snippets and keeps checks; release turns on strip
# and optimize and keeps checks. The words `debug` and `release` also work in
# the target expressions, so code can differ by profile (see platform/).
#
# profile = "debug"
#
# [profiles.release]
# checks = false

# Programs. Without any [program.<name>] the project is one program named after
# its folder, built from the keys above and starting at its only `main`. Declare
# programs to build more than one from the same files: `wisp build` builds all of
# them, `wisp build tools` one, and `wisp run tools -- arguments` runs one (the
# name can be left out for the program named by `default`, or when there is
# just one). The keys on top are the defaults of every program, and a program
# overrides them. Precedence: flag, program, system, top level; `link` adds up
# instead of replacing. {os}, {arch} and {name} (the name of the binary) are
# replaced in every output path.
#
# [program.tools]
# entry = "tools/main.wsp"      # the file whose main starts it
# name = "mytools"              # the binary, which defaults to "tools"
# link = ["-lm"]
# os = "windows"                # a program can be built for another system
#
# [program.tools.output]
# bin = "out/{arch}"
#
# [program.tools.run.env]
# VERBOSE = "1"
#
# A program can adjust itself for one system, with [program.<name>.<os>] (and
# [program.<name>.<os>.<arch>] for one architecture of it). Only name, link,
# libc, output and run.env can change there: link adds to the program's, the
# folders of output replace only the ones written, and run.env adds to the
# program's.
#
# [program.tools.linux]
# link = ["-lpthread"]
# name = "mytools-linux"

# Exports, for C and other languages. An export has no entry, so what it is made of is written down: the
# modules it lists, by import path, and everything they import. Whatever nobody
# reaches stays out, for exports and for programs alike. `wisp build` builds
# the exports along with the programs. An x86-64 export is an archive,
# <name>.a in the `bin` folder, that holds those modules, the standard library
# modules they use and the runtime of the system, so it links on its own; name it
# libgeo if you want to link it with -lgeo. Ask for `obj` alone and only the
# object files are written.
#
# [export.geo]
# modules = ["geometry", "shapes"]
#
# [export.geo.output]
# bin = "dist"

# A system of your own, for instance a userspace for a kernel. A system says how
# to build for it: where the program starts, what the runtime is, how to link.
# Where the result goes is up to the program, not the system.
# `wisp init target mykernel` creates this block and its files.
#
# [targets.mykernel]
# arch = "x64"                  # required, only x64 exists for now
# entry = "_start"              # the symbol the linker starts at
# start = "targets/mykernel/start.asm"       # required: calls main and leaves
# runtime = "targets/mykernel/runtime.asm"   # emit, panic, malloc and friends
# link = ["-z", "noexecstack"]  # extra linker arguments
# libc = false                  # link the C library for this system
#
# Built-in systems (linux, windows) are not adjusted here: link and libc go at the top
# level or in a [program.<name>] block, and a different start or runtime is a system
# of your own under another name. A system with more than one architecture
# describes each one in [targets.<os>.<arch>].

# Environment variables for the program when it is started by `wisp run`. A
# variable already set in the shell wins, so `NAME=other wisp run` overrides
# what is written here. A program started by hand does not get them.
# [run.env]
# LOG_LEVEL = "debug"

# `wisp fmt` formats every .wsp file of the project with one style that has no
# options. The only thing written here is what it leaves alone: folders and
# files relative to the project root. A name without a slash matches at any
# depth, so "generated" skips every folder of that name.
# [fmt]
# exclude = ["generated", "third_party/api.wsp"]
